name: Release

# Publishing from CI rather than a laptop, for three reasons: an npm automation
# token is exempt from the interactive 2FA prompt that blocks scripted publishes,
# the artifact is built from a clean checkout rather than whatever is on someone's
# disk, and npm provenance can attest which commit and workflow produced it.
#
# Cut a release:
#   npm version minor          # or patch / major — writes the tag
#   git push --follow-tags
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and verify without publishing'
        type: boolean
        default: true

permissions:
  contents: read
  # Required for npm provenance: lets the runner mint the OIDC token that
  # links the published tarball to this commit and workflow.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # The same gate a local `npm publish` would run, made explicit so a
      # failure names which step went wrong.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Guards against the two packaging bugs this project has actually shipped:
      # a React entry that lost its 'use client' directive in the bundler, and a
      # stylesheet that never made it into dist.
      - name: Verify the artifact
        run: |
          set -e
          head -1 dist/react.mjs | grep -q "use client" || {
            echo "::error::dist/react.mjs is missing the 'use client' directive"; exit 1; }
          head -1 dist/react.js  | grep -q "use client" || {
            echo "::error::dist/react.js is missing the 'use client' directive"; exit 1; }
          test -s dist/styles.css || { echo "::error::dist/styles.css missing or empty"; exit 1; }
          for f in index react logos; do
            test -s "dist/$f.d.ts" || { echo "::error::dist/$f.d.ts missing"; exit 1; }
          done
          echo "artifact verified"

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json $PKG"
            exit 1
          fi
          echo "publishing $PKG"

      - name: Publish
        if: github.event_name == 'push' || inputs.dry_run == false
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --access public --provenance --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
